<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">David Santiago González Rico · Rakvor DFIR tools</title>
  <desc id="desc">Green header: name, roles (Digital Forensics Engineer, eDiscovery Analyst, Cybersecurity Analyst) and a hash-chained audit log motif for the Rakvor DFIR suite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06140F"/>
      <stop offset="0.55" stop-color="#0A1F18"/>
      <stop offset="1" stop-color="#0D2B20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A936F"/>
      <stop offset="0.5" stop-color="#2EA043"/>
      <stop offset="1" stop-color="#7EE2B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="930" cy="160" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EA043" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2EA043" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1A936F" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

    <!-- left: identity -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="64" y="74" fill="#7EE2B8" font-size="15" font-weight="600" letter-spacing="5">R A K V O R  ·  D F I R</text>
      <text x="64" y="132" fill="#E6FFF4" font-size="44" font-weight="700">David Santiago</text>
      <text x="64" y="180" fill="#E6FFF4" font-size="44" font-weight="700">González Rico</text>
      <rect x="64" y="200" width="96" height="4" rx="2" fill="url(#accent)"/>
      <text x="64" y="236" fill="#A7D9C3" font-size="19" font-weight="500">Digital Forensics Engineer · eDiscovery Analyst · Cybersecurity Analyst</text>
      <text x="64" y="268" fill="#6FAE93" font-size="15">Forensics · Pentesting · SOC for SMEs in Colombia and France</text>
    </g>

    <!-- right: hash-chained audit log -->
    <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12">
      <g transform="translate(790 70)">
        <rect width="150" height="54" rx="10" fill="#0B261C" stroke="#2EA043" stroke-opacity="0.8"/>
        <text x="14" y="22" fill="#7EE2B8">#1 intake</text>
        <text x="14" y="40" fill="#4E8A71">sha256 3f9a…c21</text>
      </g>
      <path d="M940 97 H986" stroke="#2EA043" stroke-width="2" stroke-dasharray="4 4"/>
      <g transform="translate(986 70)">
        <rect width="150" height="54" rx="10" fill="#0B261C" stroke="#2EA043" stroke-opacity="0.8"/>
        <text x="14" y="22" fill="#7EE2B8">#2 analyze</text>
        <text x="14" y="40" fill="#4E8A71">prev 3f9a…c21</text>
      </g>
      <path d="M1061 124 V156" stroke="#2EA043" stroke-width="2" stroke-dasharray="4 4"/>
      <g transform="translate(986 156)">
        <rect width="150" height="54" rx="10" fill="#0B261C" stroke="#2EA043" stroke-opacity="0.8"/>
        <text x="14" y="22" fill="#7EE2B8">#3 report</text>
        <text x="14" y="40" fill="#4E8A71">prev 8b04…e7d</text>
      </g>
      <path d="M986 183 H940" stroke="#2EA043" stroke-width="2" stroke-dasharray="4 4"/>
      <g transform="translate(790 156)">
        <rect width="150" height="54" rx="10" fill="#0F3326" stroke="#7EE2B8"/>
        <text x="14" y="22" fill="#E6FFF4">RFC 3161</text>
        <text x="14" y="40" fill="#7EE2B8">TSA-signed ✓</text>
      </g>
      <text x="790" y="250" fill="#6FAE93" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Signals, not verdicts · tamper-evident audit logs</text>
    </g>
  </g>
</svg>
